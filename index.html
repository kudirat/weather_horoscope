<!DOCTYPE html>
<html>

<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monofett&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Monofett&display=swap" rel="stylesheet">
   
</head>

<body>
    <h1 id="landing-title">Your Weather Forecast for the Week</h1>
    <input style="height: 30px;" oninput="updateCountry()" type="text" id="country-input" placeholder="United States">
    <input style="height: 30px;" oninput="updateState()" type="text" id="state-input" placeholder="New York">
    <button id="get-forecast-button" onclick="getForecast(country, state)">Get Forecast</button>
    
    <input style="height: 30px;" oninput="updateSign()" type="text" id="sign-input" placeholder="Pisces">
    <button id="get-horoscope-button" onclick="getHoroscope(sign)">Get Horoscope</button>
    <br>
    <hr>
    <table id="forecast-table">
        <tr>
            <th class="day-row" id="sunday-row">Sunday</th>
            <th class="day-row" id="monday-row">Monday</th>
            <th class="day-row" id="tuesday-row">Tuesday</th>
            <th class="day-row" id="wednesday-row">Wednesday</th>
            <th class="day-row" id="thursday-row">Thursday</th>
            <th class="day-row" id="friday-row">Friday</th>
            <th class="day-row" id="saturday-row">Saturday</th>
        </tr>
        <tr class="content-row">
            <td class="forecast-cell" id="sunday-forecast">
                <h3 id="sunday-date"></h3>
                <h3 id="sunday-high-temp"></h3>
                <h3 id="sunday-low-temp"></h3>
                <h3 id="sunday-conditions"></h3>
                <h3 id="sunday-icon"></h3> 

            </td>
            <td class="forecast-cell" id="monday-forecast">
                <h3 id="monday-date"></h3>
                <h3 id="monday-high-temp"></h3>
                <h3 id="monday-low-temp"></h3>
                <h3 id="monday-conditions"></h3>
                <h3 id="monday-icon"></h3> 
            </td>
            <td class="forecast-cell" id="tuesday-forecast">
                <h3 id="tuesday-date"></h3>
                <h3 id="tuesday-high-temp"></h3>
                <h3 id="tuesday-low-temp"></h3>
                <h3 id="tuesday-conditions"></h3>
                <h3 id="tuesday-icon"></h3> 
            </td>
            <td class="forecast-cell" id="wednesday-forecast">
                <h3 id="wednesday-date"></h3>
                <h3 id="wednesday-high-temp"></h3>
                <h3 id="wednesday-low-temp"></h3>
                <h3 id="wednesday-conditions"></h3>
                <h3 id="wednesday-icon"></h3> 
            </td>
            <td class="forecast-cell" id="thursday-forecast">
                <h3 id="thursday-date"></h3>
                <h3 id="thursday-high-temp"></h3>
                <h3 id="thursday-low-temp"></h3>
                <h3 id="thursday-conditions"></h3>
                <h3 id="thursday-icon"></h3>
            </td>
            <td class="forecast-cell" id="friday-forecast">
                <h3 id="friday-date"></h3>
                <h3 id="friday-high-temp"></h3>
                <h3 id="friday-low-temp"></h3>
                <h3 id="friday-conditions"></h3>
                <h3 id="friday-icon"></h3>
            </td>
            <td class="forecast-cell" id="saturday-forecast">
                <h3 id="saturday-date"></h3>
                <h3 id="saturday-high-temp"></h3>
                <h3 id="saturday-low-temp"></h3>
                <h3 id="saturday-conditions"></h3>
                <h3 id="saturday-icon"></h3>

            </td>
        </tr>
    </table>
    <div class="horoscope-panel" id="horoscope-panel" hidden>
        <h2 id="horoscope-title">Your Horoscope: </h2>
        <h3 id="horoscope-text"></h3>
        <button onclick="closeHoroscope()" id="close-horoscope"><span>&#10008;</span></button>
    </div>
</body>
<script src="sketch.js"></script>

</html>
